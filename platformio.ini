; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; default_envs = esp32c3-gamepad
default_envs = lcdwiki-es3c28p


[env:esp32s3-n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.0.4
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_ota_romfs_16mb.csv
board_build.filesystem = littlefs
board_build.embed_files = assets/gamebox_clock_wallpaper.jpg
board_build.extra_flags = -DBOARD_HAS_PSRAM -DDISABLE_ALL_LIBRARY_WARNINGS
monitor_speed = 115200
upload_speed = 921600

; 激进优化 (参考 Anemoia-ESP32)
build_unflags = -Os -O2
build_flags =
    -DDIJI_BOARD_ORIGINAL_ESP32S3
    -DDIJI_FIRMWARE_VERSION=\"0.6.6\"
    -DDIJI_OTA_CHANNEL=\"esp32s3-n16r8\"
    -Ofast
    -funroll-loops
    -fstrict-aliasing
    -fno-exceptions
    -ffunction-sections
    -fdata-sections

build_src_filter = +<*.cpp> +<*.ino> +<*.h> -<espnow_gamepad.cpp> -<.git/> -<.pio/> -<.DS_Store>

[env:lcdwiki-es3c28p]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.0.4
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_ota_romfs_16mb.csv
board_build.filesystem = littlefs
board_build.embed_files = assets/gamebox_clock_wallpaper.jpg
board_build.extra_flags = -DBOARD_HAS_PSRAM -DDISABLE_ALL_LIBRARY_WARNINGS
monitor_speed = 115200
upload_speed = 921600

; LCDWIKI ES3C28P/ES3N28P: ILI9341 + SDIO MicroSD + ES8311 audio codec.
build_unflags = -Os -O2
build_flags =
    -DDIJI_BOARD_LCDWIKI_ES3C28P
    -DDIJI_FIRMWARE_VERSION=\"0.6.6\"
    -DDIJI_OTA_CHANNEL=\"lcdwiki-es3c28p\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Ofast
    -funroll-loops
    -fstrict-aliasing
    -fno-exceptions
    -ffunction-sections
    -fdata-sections

build_src_filter = +<*.cpp> +<*.ino> +<*.h> -<espnow_gamepad.cpp> -<.git/> -<.pio/> -<.DS_Store>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<ines_header.cpp> +<ines_header.h> +<mapper_bank.cpp> +<mapper_bank.h> +<serial_controller.cpp> +<serial_controller.h> +<touch_layout.cpp> +<touch_layout.h> +<touch_controls.cpp> +<touch_controls.h> +<rom_storage.cpp> +<rom_storage.h> +<ota_version.cpp> +<ota_version.h> +<device_identity_format.cpp> +<device_identity_format.h>

[env:esp32c3-gamepad]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDIJI_GAMEPAD_FIRMWARE_VERSION=\"0.1.3\"
    -DDIJI_GAMEPAD_OTA_CHANNEL=\"esp32c3-gamepad\"
    -DDIJI_GAMEPAD_A_PIN=10
    -DDIJI_GAMEPAD_B_PIN=4
    -DDIJI_GAMEPAD_SELECT_PIN=5
    -DDIJI_GAMEPAD_START_PIN=6
    -DDIJI_GAMEPAD_UP_PIN=0
    -DDIJI_GAMEPAD_DOWN_PIN=1
    -DDIJI_GAMEPAD_LEFT_PIN=3
    -DDIJI_GAMEPAD_RIGHT_PIN=7
    -DDIJI_GAMEPAD_LED_PIN=8
    -DDIJI_GAMEPAD_LED_ACTIVE_LEVEL=1
    -DDIJI_GAMEPAD_BATTERY_PIN=2
    -DDIJI_GAMEPAD_RUMBLE_PIN=20
build_src_filter = +<espnow_gamepad.cpp> +<espnow_gamepad_protocol.h> +<serial_controller.cpp> +<serial_controller.h> +<network_security.cpp> +<network_security.h> +<ota_version.cpp> +<ota_version.h>

